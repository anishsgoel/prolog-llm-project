# London Underground network — the single source of truth for the abduction benchmark.
#
# HOW TO READ / EDIT THIS FILE
# ---------------------------------------------------------------------------
# Each line is a list of ordered *branch sequences*.  An edge exists between
# every pair of CONSECUTIVE stations within a sequence, and nowhere else.  That
# is what structurally guarantees rule R2 (no shortcut edges): you cannot write
# down a long-hop edge without also writing down the stations it skips.
#
# Junction stations are repeated at the ends of branches so the branches stitch
# into one graph.  Duplicate edges across lines are expected and deduplicated by
# tools/build_london_benchmark.py.
#
# Station names are the official (Wikipedia/TfL) names.  They are converted to
# Prolog atoms by `canonical_atom()` in the builder; see station_atoms.csv for
# the full mapping.
#
# STATION-IDENTITY CONVENTIONS (see docs/LONDON_BENCHMARK.md §"Data verification")
#   * "Edgware Road (Bakerloo)" and "Edgware Road" are TWO DIFFERENT STATIONS.
#     They sit on opposite sides of Marylebone Road, share no track, and the
#     tube map draws them as two separate dots.  Merging them would invent an
#     interchange that does not exist.
#   * "Hammersmith" and "Paddington" are each modelled as ONE station even
#     though Wikipedia's 272-station count lists two entries for each (the
#     District/Piccadilly vs Circle/H&C buildings at Hammersmith; the Praed St
#     vs Bishop's Bridge Rd platforms at Paddington).  The tube map draws one
#     interchange dot for each, and an LLM asked about "Hammersmith" means the
#     interchange.  Consequently this file has 270 stations, not 272.
#   * "Shepherd's Bush" (Central) and "Shepherd's Bush Market" (Circle/H&C) are
#     different stations and must never be conflated.
#   * The operational "Wood Lane" (Circle/H&C, opened 2008) is included.  The
#     Central line's Wood Lane (closed 1947) is not.

version: 1

# ---------------------------------------------------------------------------
# Express skips: pairs of consecutive *stops* on a line that are NOT physically
# adjacent.  The sequences below already avoid them; the builder re-asserts that
# none of these pairs made it into the final edge set (R2).
# ---------------------------------------------------------------------------
# `between` is ordered FROM `from` TO `to`, so the builder can assert the
# corridor exists as an unbroken chain from -> b1 -> ... -> bk -> to.
express_skips:
  - line: Metropolitan
    from: Baker Street
    to: Finchley Road
    between: [St John's Wood, Swiss Cottage]
    covered_by: Jubilee
  - line: Metropolitan
    from: Finchley Road
    to: Wembley Park
    between: [West Hampstead, Kilburn, Willesden Green, Dollis Hill, Neasden]
    covered_by: Jubilee
  - line: Piccadilly
    from: Earl's Court
    to: Barons Court
    between: [West Kensington]
    covered_by: District
  - line: Piccadilly
    from: Hammersmith
    to: Turnham Green
    between: [Ravenscourt Park, Stamford Brook]
    covered_by: District
  - line: Piccadilly
    from: Turnham Green
    to: Acton Town
    between: [Chiswick Park]
    covered_by: District
  # Turnham Green has Piccadilly platforms only early morning / late evening.
  # For most of the day Piccadilly trains run Acton Town <-> Hammersmith
  # non-stop, which is the longest express skip on the network.  No branch
  # sequence emits this pair; the entry exists so the assertion covers it.
  - line: Piccadilly
    from: Acton Town
    to: Hammersmith
    between: [Chiswick Park, Turnham Green, Stamford Brook, Ravenscourt Park]
    covered_by: District

# ---------------------------------------------------------------------------
# Places where the network genuinely contains a short cycle, so the generic
# "is this a shortcut?" detector fires on every edge of the cycle even though
# all of them are real physical adjacencies (separate tunnels, not one tunnel
# calling at an intermediate station).  Each entry lists the stations of the
# cycle; the builder marks any flagged edge lying inside a declared cycle as
# "known" and any other hit as NEW, for manual review.
# ---------------------------------------------------------------------------
known_parallel_structures:
  - name: Northern line Camden Town - Euston
    cycle: [Camden Town, Mornington Crescent, Euston]
    why: >-
      The Bank-branch tunnels run Camden Town - Euston directly.  Mornington
      Crescent is on the Charing Cross branch only; the Bank branch tunnels do
      not pass through it, so all three edges are real.
  - name: Cromwell Curve (Gloucester Road - High Street Kensington)
    cycle: [Gloucester Road, Earl's Court, High Street Kensington]
    why: >-
      Circle and District (Edgware Road) trains run Gloucester Road - High
      Street Kensington over the Cromwell Curve without calling at Earl's
      Court, while District/Piccadilly trains run via Earl's Court.  Separate
      tracks, so all three edges are real.
  - name: Heathrow Terminal 4 loop
    cycle: [Hatton Cross, Heathrow Terminal 4, Heathrow Terminals 2 & 3]
    why: >-
      The original 1977 tunnel runs Hatton Cross - Heathrow Central directly and
      still carries all Terminal 5 trains; the Terminal 4 loop is a separate
      pair of tunnels.  All three edges are real.

# Edges that are NOT flagged by the detector but are worth recording, because a
# reader of the tube map might assume they skip a station.
documented_non_shortcuts:
  - from: Liverpool Street
    to: Aldgate East
    why: >-
      District/H&C tracks diverge from the Circle/Metropolitan tracks east of
      Liverpool Street and reach Aldgate East without passing through Aldgate.

