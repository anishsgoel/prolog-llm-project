# ---------------------------------------------------------------------------
# Difficulty tiers.  Every tier is an INDUCED SUBGRAPH of the full network:
# same canonical atoms, same edges restricted to the included stations, so
# results are comparable across tiers.  A tier must be connected; the builder
# reports (and drops) any station stranded by the cut.
#
# Selection is by whole line (`lines`) and/or by individual branch
# (`branches`, written "<line key>/<branch name>"), optionally intersected
# with a maximum fare zone (`max_zone`).
# ---------------------------------------------------------------------------
tiers:
  t1:
    file: london_t1_bakerloo.pl
    title: Bakerloo line only
    lines: [bakerloo]
  t2:
    file: london_t2_zone1.pl
    title: Central London core - Inner Circle, Central trunk, Victoria, Northern central
    branches:
      - circle/inner_circle
      - central/trunk
      - victoria/main
      - northern/charing_cross_central
      - northern/bank_central
  t3:
    file: london_t3_west.pl
    title: West London - District and Piccadilly in full, plus the Circle's Hammersmith branch
    lines: [district, piccadilly]
    branches:
      - circle/hammersmith
  t4:
    file: london_t4_core.pl
    title: All 11 lines, Zones 1-3
    lines: [bakerloo, central, circle, district, hammersmith_city, jubilee,
            metropolitan, northern, piccadilly, victoria, waterloo_city]
    max_zone: 3
  t5:
    file: london_t5_full.pl
    title: Complete network, all 11 lines
    lines: [bakerloo, central, circle, district, hammersmith_city, jubilee,
            metropolitan, northern, piccadilly, victoria, waterloo_city]
